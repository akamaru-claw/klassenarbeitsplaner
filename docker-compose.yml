services:
  klassenarbeiten:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:3000"
    environment:
      ADMIN_PASSWORD: "hier-ein-langes-passwort-fuer-die-verwaltung"
      KOLLEGIUM_PASSWORD: "nur-beim-ersten-start-noetig"
      SESSION_SECRET: "hier-einen-zufallswert-eintragen"   # openssl rand -hex 32
      TRUST_PROXY: "1"
    volumes:
      - klassenarbeiten-data:/data
volumes:
  klassenarbeiten-data:
